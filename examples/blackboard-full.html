<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casuya Blackboard - Full Integration Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tool-btn.active { background: #2563eb; color: white; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.3s ease; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <nav class="bg-white border-b border-slate-100 px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white font-extrabold text-sm">C</div>
        <span class="text-lg font-extrabold text-slate-900">Casuya Blackboard</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-xs font-semibold text-slate-400">Full Integration Demo</span>
        <a href="/index.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600">Back to Platform</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <!-- Header -->
    <div class="mb-8">
      <div class="flex items-center gap-2 mb-2">
        <span class="px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded-md">Mathematics</span>
        <span class="px-2 py-0.5 bg-slate-100 text-slate-500 text-xs font-bold rounded-md">Form 2</span>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Quadratic Equations</h1>
      <p class="text-slate-500">Solve the following quadratic equation by factoring. Show all steps.</p>
    </div>

    <div class="grid lg:grid-cols-12 gap-6">
      <!-- Left: Blackboard + Tools -->
      <div class="lg:col-span-8">
        <!-- Problem Card -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl p-6 mb-4 shadow-lg shadow-blue-200/50">
          <div class="text-xs font-bold uppercase tracking-wider opacity-75 mb-2">Problem</div>
          <div id="problem-latex" class="text-2xl"></div>
        </div>

        <!-- Toolbar -->
        <div class="flex flex-wrap items-center gap-2 mb-4 bg-white border border-slate-100 rounded-xl p-3 shadow-sm">
          <div class="flex items-center gap-1">
            <button class="tool-btn active p-2 rounded-lg border border-slate-200 hover:border-blue-300 transition-colors" data-tool="pen" title="Pen">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
            </button>
            <button class="tool-btn p-2 rounded-lg border border-slate-200 hover:border-blue-300 transition-colors" data-tool="eraser" title="Eraser">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
            <button class="tool-btn p-2 rounded-lg border border-slate-200 hover:border-blue-300 transition-colors" data-tool="highlighter" title="Highlighter">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            </button>
          </div>
          <div class="h-4 w-px bg-slate-200"></div>
          <input type="color" id="color-picker" value="#1e293b" class="w-6 h-6 rounded border border-slate-200 cursor-pointer">
          <input type="range" id="size-slider" min="1" max="12" value="2" class="w-16">
          <div class="flex-1"></div>
          <button id="undo-btn" class="p-2 rounded-lg border border-slate-200 hover:border-blue-300 transition-colors disabled:opacity-30" disabled title="Undo">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 10h10a5 5 0 015 5v2M3 10l4-4M3 10l4 4"/></svg>
          </button>
          <button id="redo-btn" class="p-2 rounded-lg border border-slate-200 hover:border-blue-300 transition-colors disabled:opacity-30" disabled title="Redo">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10H11a5 5 0 00-5 5v2M21 10l-4-4M21 10l-4 4"/></svg>
          </button>
        </div>

        <!-- Blackboard -->
        <div id="blackboard-container" class="bg-white border border-slate-100 rounded-2xl shadow-lg overflow-hidden"></div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap items-center gap-3 mt-4">
          <button id="validate-btn" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold bg-green-600 text-white hover:bg-green-700 transition-colors shadow-lg shadow-green-200/50">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
            Validate Step
          </button>
          <button id="next-step-btn" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200/50">
            Next Step
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <button id="finish-btn" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold bg-slate-900 text-white hover:bg-slate-800 transition-colors">
            Finish Solution
          </button>
          <div class="flex-1"></div>
          <button id="new-problem-btn" class="px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 hover:border-blue-300 transition-colors">New Problem</button>
        </div>
      </div>

      <!-- Right: Steps + Score -->
      <div class="lg:col-span-4 space-y-4">
        <!-- Steps -->
        <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-slate-900">Your Solution</h3>
            <span class="text-xs font-bold text-slate-400" id="step-indicator">Step 1</span>
          </div>
          <div id="steps-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
        </div>

        <!-- Validation Result -->
        <div id="validation-card" class="hidden bg-white border border-slate-100 rounded-2xl p-4 shadow-sm animate-in">
          <h3 class="text-sm font-bold text-slate-900 mb-2">Validation Result</h3>
          <div id="validation-content"></div>
        </div>

        <!-- Score -->
        <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
          <h3 class="text-sm font-bold text-slate-900 mb-3">Score</h3>
          <div class="text-center mb-3">
            <div class="text-4xl font-extrabold" id="score-display" style="color: #2563eb">0%</div>
          </div>
          <div class="space-y-2">
            <div class="flex justify-between text-xs">
              <span class="text-slate-500">Correct Steps</span>
              <span class="font-bold text-green-600" id="correct-count">0 / 0</span>
            </div>
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
              <div id="progress-bar" class="h-full bg-green-500 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Export -->
        <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
          <h3 class="text-sm font-bold text-slate-900 mb-3">Export</h3>
          <div class="space-y-2">
            <button id="export-png-btn" class="w-full px-4 py-2 rounded-xl text-xs font-semibold border border-slate-200 hover:border-blue-300 transition-colors text-left">
              Export as PNG
            </button>
            <button id="export-json-btn" class="w-full px-4 py-2 rounded-xl text-xs font-semibold border border-slate-200 hover:border-blue-300 transition-colors text-left">
              Export as JSON
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { Blackboard, createToolbar } from '../dist/index.js';

    const container = document.getElementById('blackboard-container');
    let currentStep = 1;
    const steps = [];

    const problems = [
      { latex: 'x^2 + 5x + 6 = 0', answer: '(x+2)(x+3)=0' },
      { latex: 'x^2 - 4 = 0', answer: '(x-2)(x+2)=0' },
      { latex: '2x^2 - 8x = 0', answer: '2x(x-4)=0' },
      { latex: 'x^2 - 9x + 20 = 0', answer: '(x-4)(x-5)=0' },
    ];
    let currentProblem = problems[0];

    const engine = new Blackboard({ container, width: 800, height: 450 });
    createToolbar(engine);

    engine.on('change', () => {
      document.getElementById('undo-btn').disabled = engine.getElements().length === 0;
    });
    engine.on('undo', () => {
      document.getElementById('undo-btn').disabled = engine.getElements().length === 0;
      document.getElementById('redo-btn').disabled = false;
    });
    engine.on('redo', () => {
      document.getElementById('undo-btn').disabled = false;
      document.getElementById('redo-btn').disabled = true;
    });

    function renderProblem(problem) {
      const el = document.getElementById('problem-latex');
      import('https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.mjs')
        .then((katex) => katex.default.render(problem.latex, el, { displayMode: true, throwOnError: false }))
        .catch(() => { el.textContent = problem.latex; });
    }
    renderProblem(currentProblem);

    document.querySelectorAll('.tool-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const t = btn.dataset.tool;
        engine.setTool(t === 'highlighter' ? 'pen' : t);
      });
    });

    document.getElementById('color-picker').addEventListener('input', (e) => engine.setColor(e.target.value));
    document.getElementById('size-slider').addEventListener('input', (e) => engine.setWidth(parseInt(e.target.value)));
    document.getElementById('undo-btn').addEventListener('click', () => engine.undo());
    document.getElementById('redo-btn').addEventListener('click', () => engine.redo());

    function addStepCard(num) {
      const list = document.getElementById('steps-list');
      const card = document.createElement('div');
      card.className = 'border-2 border-dashed border-slate-200 rounded-xl p-3 animate-in';
      card.dataset.step = num;
      card.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-400">Step ${num}</span>
          <span class="text-sm italic text-slate-400">Not yet validated</span>
        </div>`;
      list.appendChild(card);
    }
    addStepCard(1);

    document.getElementById('validate-btn').addEventListener('click', async () => {
      if (engine.getElements().length === 0) {
        alert('Write your step first!');
        return;
      }
      // Validate against the API equivalence endpoint.
      const API = location.port === '8765' ? location.origin : `${location.protocol}//${location.hostname}:8765`;
      let equivalent = false;
      try {
        const res = await fetch(`${API}/math/equivalence`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expr1: currentProblem.answer, expr2: currentProblem.latex }),
        });
        equivalent = (await res.json()).equivalent;
      } catch { equivalent = false; }

      const card = document.querySelector(`[data-step="${currentStep}"]`);
      if (card) {
        card.classList.remove('border-dashed');
        card.classList.add(equivalent ? 'border-green-400 bg-green-50' : 'border-yellow-400 bg-yellow-50');
        const label = card.querySelector('.text-sm');
        label.textContent = equivalent ? 'Correct!' : 'Keep trying...';
        label.classList.remove('italic');
      }

      steps.push({ step: currentStep, correct: equivalent });
      updateScore();

      const valCard = document.getElementById('validation-card');
      valCard.classList.remove('hidden');
      document.getElementById('validation-content').innerHTML = `
        <div class="flex items-center gap-2 mb-2">
          <div class="w-8 h-8 rounded-full flex items-center justify-center ${equivalent ? 'bg-green-100' : 'bg-yellow-100'}">
            <svg class="w-4 h-4 ${equivalent ? 'text-green-600' : 'text-yellow-600'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              ${equivalent ? '<path d="M5 13l4 4L19 7"/>' : '<path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>'}
            </svg>
          </div>
          <div>
            <div class="text-sm font-bold ${equivalent ? 'text-green-700' : 'text-yellow-700'}">
              ${equivalent ? 'Step Correct!' : 'Not Quite Right'}
            </div>
          </div>
        </div>`;
    });

    document.getElementById('next-step-btn').addEventListener('click', () => {
      currentStep++;
      engine.clear();
      addStepCard(currentStep);
      document.getElementById('step-indicator').textContent = `Step ${currentStep}`;
      document.getElementById('validation-card').classList.add('hidden');
    });

    document.getElementById('finish-btn').addEventListener('click', () => {
      const score = steps.length > 0 ? Math.round((steps.filter((s) => s.correct).length / steps.length) * 100) : 0;
      alert(`Solution finished! Score: ${score}% (${steps.filter((s) => s.correct).length}/${steps.length} correct steps)`);
    });

    document.getElementById('new-problem-btn').addEventListener('click', () => {
      currentProblem = problems[Math.floor(Math.random() * problems.length)];
      renderProblem(currentProblem);
      engine.clear();
      currentStep = 1;
      steps.length = 0;
      document.getElementById('steps-list').innerHTML = '';
      addStepCard(1);
      updateScore();
      document.getElementById('step-indicator').textContent = 'Step 1';
      document.getElementById('validation-card').classList.add('hidden');
    });

    function updateScore() {
      const correct = steps.filter((s) => s.correct).length;
      const total = steps.length;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      document.getElementById('score-display').textContent = `${pct}%`;
      document.getElementById('score-display').style.color = pct >= 70 ? '#16a34a' : pct >= 40 ? '#d97706' : '#dc2626';
      document.getElementById('correct-count').textContent = `${correct} / ${total}`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    document.getElementById('export-png-btn').addEventListener('click', () => {
      const url = engine.toDataURL();
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blackboard-solution.png';
      a.click();
    });

    document.getElementById('export-json-btn').addEventListener('click', () => {
      const json = JSON.stringify(engine.exportJSON());
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blackboard-solution.json';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
